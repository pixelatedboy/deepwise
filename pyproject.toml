[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "deepwise"
version = "0.1.0"
description = "A small Deep Learning library implemented in Rust with Python bindings"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
module-name = "deepwise"
manifest-path = "Cargo.toml"
